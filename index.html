<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/core/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/core/main.ts" defer></script>
  </head>

  <body
    class="min-h-screen bg-[#f6f6f6] text-[#0f0f0f] antialiased dark:bg-[#2f2f2f] dark:text-[#f6f6f6]"
    style="font-family: Inter, Avenir, Helvetica, Arial, sans-serif"
  >
    <main
      class="m-0 flex flex-col items-center justify-center gap-4 pt-[10vh] text-center"
    >
      <h1 class="text-5xl font-bold leading-tight">Welcome to Tauri</h1>

      <div class="flex justify-center">
        <a
          class="font-medium text-[#646cff] no-underline hover:text-[#535bf2] dark:hover:text-[#24c8db]"
          href="https://vite.dev"
          target="_blank"
        >
          <img
            src="/src/core/assets/vite.svg"
            class="logo vite h-24 p-6"
            alt="Vite logo"
          />
        </a>
        <a
          class="font-medium text-[#646cff] no-underline hover:text-[#535bf2] dark:hover:text-[#24c8db]"
          href="https://tauri.app"
          target="_blank"
        >
          <img
            src="/src/core/assets/tauri.svg"
            class="logo tauri h-24 p-6"
            alt="Tauri logo"
          />
        </a>
        <a
          class="font-medium text-[#646cff] no-underline hover:text-[#535bf2] dark:hover:text-[#24c8db]"
          href="https://www.typescriptlang.org/docs"
          target="_blank"
        >
          <img
            src="/src/core/assets/typescript.svg"
            class="logo typescript h-24 p-6"
            alt="typescript logo"
          />
        </a>
      </div>
      <p class="text-base">
        Click on the Tauri logo to learn more about the framework
      </p>

      <form class="flex justify-center gap-0" id="greet-form">
        <input
          id="greet-input"
          class="mr-[5px] rounded-lg border border-transparent bg-white px-5 py-[0.6em] text-base font-medium text-[#0f0f0f] shadow-[0_2px_2px_rgba(0,0,0,0.2)] outline-none transition-[border-color] duration-[0.25s] dark:bg-[#0f0f0f98] dark:text-white"
          placeholder="Enter a name..."
        />
        <button
          type="submit"
          class="cursor-pointer rounded-lg border border-transparent bg-white px-5 py-[0.6em] text-base font-medium text-[#0f0f0f] shadow-[0_2px_2px_rgba(0,0,0,0.2)] outline-none transition-[border-color] duration-[0.25s] hover:border-[#396cd8] active:border-[#396cd8] active:bg-[#e8e8e8] dark:bg-[#0f0f0f98] dark:text-white dark:active:bg-[#0f0f0f69]"
        >
          Greet
        </button>
      </form>
      <p id="greet-msg"></p>
    </main>
  </body>
</html>
